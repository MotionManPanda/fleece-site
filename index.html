<!DOCTYPE html>
<html>
<head>
    <title>Fleece Johnson</title>

    <style>
        body {
            background-color: black;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            margin-top: 50px;
        }

        .panda {
            font-size: 150px;
            display: inline-block;
            margin-top: 50px;

            animation-name: dance;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }

        @keyframes dance {
            0% {
                transform: rotate(-15deg) translateY(0px);
            }

            25% {
                transform: rotate(15deg) translateY(-30px);
            }

            50% {
                transform: rotate(-15deg) translateY(0px);
            }

            75% {
                transform: rotate(15deg) translateY(-30px);
            }

            100% {
                transform: rotate(-15deg) translateY(0px);
            }
        }
    </style>
</head>

<body>

    <h1>Fleece Johnson Took Your Butt 💀</h1>

    <div class="panda">
        🐼
    </div>

</body>
</html>
